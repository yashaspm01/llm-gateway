name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: pytest -q

  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gateway
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      GATEWAY_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[postgres]"
      - name: Migrate up
        run: alembic upgrade head
      - name: Models and migrations agree
        run: alembic check
      - name: Migrate down and up again
        run: |
          alembic downgrade base
          alembic upgrade head

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t llm-gateway:ci .
      - name: Smoke test
        run: |
          docker run -d --name gw -p 8000:8000 -e GATEWAY_ADMIN_TOKEN=ci-token llm-gateway:ci
          for i in $(seq 1 30); do curl -sf localhost:8000/health && break; sleep 1; done
          curl -sf localhost:8000/health
          code=$(curl -s -o /dev/null -w '%{http_code}' localhost:8000/v1/chat/completions \
            -H 'content-type: application/json' \
            -d '{"model":"m","messages":[{"role":"user","content":"hi"}]}')
          test "$code" = "401"
      - name: Container logs
        if: always()
        run: docker logs gw
